<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Retrieve Reiatsu Signature</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="auth-box">
        <h2 style="color: #00c3ff; font-family: 'UnifrakturMaguntia', cursive; text-shadow: 0 0 10px rgba(0, 195, 255, 0.8); letter-spacing: 2px;">Identity Verification</h2>
        
        {% if error %}
            <p style="color: #ff3333; font-weight: bold; text-shadow: 0 0 8px rgba(255,0,0,0.6);">{{ error }}</p>
        {% else %}
            <p>Enter your full operative dossier to override security.</p>
        {% endif %}

        <form method="POST" id="auth-form">
            <label>Full Name:</label>
            <input type="text" name="full_name" required>

            <label>Username:</label>
            <input type="text" name="username" required>

            <label>E-mail ID:</label>
            <input type="email" name="email" required>

            <label>New Password:</label>
            <div class="password-wrapper">
                <input type="password" name="new_password" id="forgot-pwd" required>
                <span class="toggle-icon" onclick="togglePassword('forgot-pwd', this)">👁️</span>
            </div>

            <button type="submit" class="btn">Override Security</button>
        </form>
        <p style="margin-top: 25px;"><a href="{{ url_for('login') }}">← Back to Login</a></p>
    </div>

    <!-- Connects the Kurohitsugi animation and password eye toggle -->
    <script src="{{ url_for('static', filename='effects.js') }}"></script>
</body>
</html>
